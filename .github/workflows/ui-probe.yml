# Manual UI check: launches the demo on a macOS runner, clicks message rows with real mouse
# events and saves a screenshot after each click (Actions → UI probe → Run workflow).
name: UI probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./scripts/build-app.sh
      - name: Click through the demo list
        run: |
          BIN="build/Veery Mail.app/Contents/MacOS/VeeryMail"
          "$BIN" -demo YES > app.log 2>&1 &
          sleep 12
          swiftc -O scripts/ui-probe/click.swift -o click
          shot() { sleep 1.2; screencapture -x "probe-$1.png"; }
          shot 0-start
          ./click 360 226; shot 1-imani
          ./click 360 356; shot 2-mateo
          ./click 540 244 0 0 1.5; shot 3-imani-preview-right-after-resting
          ./click 540 373 0 0 1.5; shot 4-mateo-preview-right-after-resting
          ./click 470 290 0 0 1.5; shot 5-shelf-hover-shows-actions-over-date
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            probe-*.png
            app.log
