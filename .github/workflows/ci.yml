name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub retired its macOS 14 image, so the oldest hosted runner is macOS 15.
        # The package's macOS 14 deployment target is still enforced at compile time
        # (API availability checks); running on macOS 14 itself needs a local or
        # self-hosted machine (see docs/RELEASING.md).
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build 2>&1 | tee build.log

      - name: Test
        timeout-minutes: 10
        env:
          NSUnbufferedIO: "YES"   # print each test as it starts, so a hang shows which test
        run: swift test 2>&1 | tee test.log

      - name: Release app bundle (ad-hoc signed)
        run: ./scripts/build-app.sh 2>&1 | tee bundle.log

      - name: Verify bundle
        run: |
          APP="build/Veery Mail.app"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/VeeryMail"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"

      - name: Launch smoke test (demo mode, compose window, emoji picker)
        timeout-minutes: 3
        run: |
          APP="build/Veery Mail.app"
          rm -f ~/Library/Logs/DiagnosticReports/VeeryMail* 2>/dev/null || true
          open "$APP" --args -demo YES -uitest.openEmoji YES
          sleep 15
          screencapture -x smoke.png 2>/dev/null || true
          if pgrep -x VeeryMail >/dev/null; then
            echo "App still running after opening compose and the emoji picker."
            pkill -x VeeryMail || true
          else
            echo "::error::Veery Mail exited during the smoke test"
            for f in ~/Library/Logs/DiagnosticReports/VeeryMail*; do
              [ -f "$f" ] || continue
              echo "== $f"; head -c 60000 "$f"
            done
            exit 1
          fi

      - name: Strict concurrency check (warnings only)
        continue-on-error: true
        run: |
          # Separate build folder so every file is recompiled with the stricter checks.
          swift build --scratch-path .build-strict -Xswiftc -strict-concurrency=complete 2>&1 | tee concurrency.log
          echo "Concurrency warnings: $(grep -c 'warning:' concurrency.log || true)"

      - name: Warning summary
        if: always()
        run: |
          for f in build.log test.log concurrency.log; do
            [ -f "$f" ] || continue
            echo "== $f =="
            grep -E "(warning|error):" "$f" | sed 's#^.*/Sources/#Sources/#' | sort -u | head -150 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: |
            *.log
            smoke.png
          retention-days: 14
