# Signed, notarized release build. Runs only when started by hand (Actions → Release → Run workflow)
# and only if the signing secrets below have been added to the repository. Nothing is published:
# the zip is uploaded as a workflow artifact for you to check and attach to a release yourself.
#
# Repository secrets to add (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_P12_BASE64   base64 of your "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_P12_PASSWORD password for that .p12
#   DEVELOPER_ID              identity name, e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_APPLE_ID           Apple ID email used for notarization
#   NOTARY_TEAM_ID            10-character team ID
#   NOTARY_PASSWORD           app-specific password for that Apple ID
name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::Signing secrets are not configured. See the comments at the top of release.yml."
            exit 1
          fi
      - name: Import signing certificate into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: xcrun notarytool store-credentials veery-notary --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --keychain "$RUNNER_TEMP/release.keychain-db"
      - name: Build, sign, notarize, staple
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_PROFILE: veery-notary
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Veery-Mail
          path: build/Veery-Mail.zip
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
