# Signed, notarized release build. Runs only when started by hand (Actions → Release → Run workflow)
# and only if the signing secrets below have been added to the repository.
# It publishes the signed app and appcast to a GitHub release.
#
# Repository secrets to add (Settings → Secrets and variables → Actions):
#   DEVELOPER_ID_P12_BASE64   base64 of your "Developer ID Application" certificate exported as .p12
#   DEVELOPER_ID_P12_PASSWORD password for that .p12
#   DEVELOPER_ID              identity name, e.g. "Developer ID Application: Your Name (TEAMID)"
#   NOTARY_APPLE_ID           Apple ID email used for notarization
#   NOTARY_TEAM_ID            10-character team ID
#   NOTARY_PASSWORD           app-specific password for that Apple ID
#   SPARKLE_PRIVATE_ED_KEY    Sparkle update-signing private key
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, matching the app version (for example v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
        run: |
          if [ -z "$P12" ]; then
            echo "::error::Signing secrets are not configured. See the comments at the top of release.yml."
            exit 1
          fi
      - name: Import signing certificate into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: xcrun notarytool store-credentials veery-notary --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --keychain "$RUNNER_TEMP/release.keychain-db"
      - name: Build, sign, notarize, staple
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_PROFILE: veery-notary
        run: ./scripts/release.sh
      - name: Create signed update feed
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release tag'; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || { echo 'Tag must match app version'; exit 1; }
          test -n "$SPARKLE_PRIVATE_ED_KEY" || { echo 'Sparkle signing key is missing'; exit 1; }
          curl -fL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          echo '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  '"$RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/sparkle" "$RUNNER_TEMP/updates"
          tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          cp build/Veery-Mail.zip "$RUNNER_TEMP/updates/"
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | "$RUNNER_TEMP/sparkle/bin/generate_appcast" --ed-key-file - -o build/appcast.xml --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" "$RUNNER_TEMP/updates"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" build/Veery-Mail.zip build/appcast.xml --title "Veery Mail $RELEASE_TAG" --generate-notes --verify-tag
      - uses: actions/upload-artifact@v4
        with:
          name: Veery-Mail
          path: build/Veery-Mail.zip
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
